{% extends "legacy/base.html" %}

{% block title %}{{ status_code }} — {{ title }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 460px; margin: 30px auto; text-align: center;">
    <div class="text-red" style="font-size: 3rem;">{{ status_code }}</div>
    <h2 class="card-title" style="margin: 8px 0;">{{ title }}</h2>
    {% if message %}
    <p class="text-gray" style="margin-bottom: 12px;">{{ message }}</p>
    {% endif %}
    <a href="/" class="btn btn-start">🏠 На главную</a>
</div>
{% endblock %}
