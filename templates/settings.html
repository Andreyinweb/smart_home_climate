{% extends "base.html" %}

{% block title %}Счетчик газа — Мониторинг климата{% endblock %}

{% block content %}

<form action="/api/settings/update" method="POST" class="settings-form">
    
    <div class="form-group" style="margin-bottom: 15px;">
        <label for="mode" style="display: block; font-weight: bold; margin-bottom: 5px;">Режим работы (mode):</label>
        <select id="mode" name="mode" class="input-field" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            <option value="BASEMENT_STREET_FLOOR" {% if mode == 'BASEMENT_STREET_FLOOR' %}selected{% endif %}>BASEMENT_STREET_FLOOR </option>
            <option value="BASEMENT_STREET" {% if mode == 'BASEMENT_STREET' %}selected{% endif %}>BASEMENT_STREET</option>
            <option value="BASEMENT_FLOOR" {% if mode == 'BASEMENT_FLOOR' %}selected{% endif %}>BASEMENT_FLOOR</option>
            <option value="BASEMENT" {% if mode == 'BASEMENT' %}selected{% endif %}>BASEMENT</option>
        </select>
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label for="interval_seconds" style="display: block; font-weight: bold; margin-bottom: 5px;">Интервал опроса (сек):</label>
        <input type="number" id="interval_seconds" name="interval_seconds" value="{{ interval_seconds }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label for="max_retries" style="display: block; font-weight: bold; margin-bottom: 5px;">Макс. попыток опроса (max_retries):</label>
        <input type="number" id="max_retries" name="max_retries" value="{{ max_retries }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label for="website_return_time" style="display: block; font-weight: bold; margin-bottom: 5px;">Интервал автообновления сайта (сек):</label>
        <input type="number" id="website_return_time" name="website_return_time" value="{{ website_return_time }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label for="t_floor_mac_diff" style="display: block; font-weight: bold; margin-bottom: 5px;">
            Разница температур пола (t_floor_mac_diff, °C):
        </label>
        <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
            <input type="number" step="0.01" id="t_floor_mac_diff" name="t_floor_mac_diff" value="{{ t_floor_mac_diff }}" required style="flex: 1; min-width: 150px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            <span class="info-badge" style="background-color: #e0f2fe; color: #0369a1; padding: 8px 12px; border-radius: 6px; font-weight: 600; font-size: 0.9em;">
                DB average_temp: <strong>{{ average_temp }} °C</strong>
            </span>
        </div>
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label for="absolute_humidity_tolerance" style="display: block; font-weight: bold; margin-bottom: 5px;">Погрешность абс. влажности (absolute_humidity_tolerance):</label>
        <input type="number" step="0.01" id="absolute_humidity_tolerance" name="absolute_humidity_tolerance" value="{{ absolute_humidity_tolerance }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label for="minimum_humidity" style="display: block; font-weight: bold; margin-bottom: 5px;">Минимальная отн. влажность (%):</label>
        <input type="number" step="0.1" id="minimum_humidity" name="minimum_humidity" value="{{ minimum_humidity }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label for="target_rh" style="display: block; font-weight: bold; margin-bottom: 5px;">Целевая отн. влажность (target_rh, %):</label>
        <input type="number" step="0.1" id="target_rh" name="target_rh" value="{{ target_rh }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
        <label for="dangerous_humidity" style="display: block; font-weight: bold; margin-bottom: 5px;">Опасная отн. влажность (%):</label>
        <input type="number" step="0.1" id="dangerous_humidity" name="dangerous_humidity" value="{{ dangerous_humidity }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-group" style="margin-bottom: 20px;">
        <label for="price_gas" style="display: block; font-weight: bold; margin-bottom: 5px;">Тариф на газ (грн/м³):</label>
        <input type="number" step="0.01" id="price_gas" name="price_gas" value="{{ price_gas }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-actions" style="margin-top: 25px;">
        <button type="submit" style="background-color: #2563eb; color: white; padding: 10px 24px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem;">
            💾 Сохранить настройки
        </button>
    </div>
</form>

{% endblock %}
